name: Refresh snapshot

# The site already pulls live rosters, scores, injuries, trends, odds and news on every load.
# This job re-bakes the heavier season model (all-week projections, stats, usage) and commits it.
# Manual-only for now: GitHub Actions is paused on this account (billing lock). Once it is
# cleared, uncomment the schedule to refresh automatically.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '17 */3 * * *'        # every 3 hours
  #   - cron: '*/30 16-23 * * 0'    # Sundays during games (UTC)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node tools/snapshot.mjs
      - name: Commit
        run: |
          git config user.name "fflab-bot"
          git config user.email "fflab-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Refresh snapshot" && git push)
