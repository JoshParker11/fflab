<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF Lab</title>
<style>
  :root { --bg:#0b0d10; --panel:#14181d; --line:#232a31; --text:#e7ebef; --dim:#8a96a3;
          --act:#f5b93a; --good:#3ecf8e; --bad:#ef5b5b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  h1 { font-size:20px; margin:0; letter-spacing:.02em; }
  h1 b { color:var(--act); }
  .sub { color:var(--dim); font-size:13px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px;
            padding:16px; margin-top:16px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td, th { padding:7px 6px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  td:first-child, th:first-child, td:nth-child(2), th:nth-child(2) { text-align:left; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  tr.me td { color:var(--act); }
  .vs { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; text-align:center; }
  .vs .big { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; }
  .vs .name { color:var(--dim); font-size:13px; }
  .scroll { overflow-x:auto; }
  .lead { color:var(--good); } .trail { color:var(--bad); }
  footer { color:var(--dim); font-size:12px; margin-top:20px; }
  a { color:var(--act); }
</style>
</head>
<body>
<main>
  <header>
    <h1>FF <b>Lab</b></h1>
    <span class="sub" id="week">loading…</span>
  </header>

  <section>
    <h2>This week</h2>
    <div class="vs" id="matchup"></div>
  </section>

  <section>
    <h2>Standings</h2>
    <div class="scroll"><table id="standings"></table></div>
  </section>

  <footer>v0 · live from the Sleeper API · control center under construction —
    see <a href="https://github.com/JoshParker11/fflab/blob/main/docs/DESIGN.md">design</a> and
    <a href="https://github.com/JoshParker11/fflab/blob/main/docs/STRATEGY.md">playbook</a></footer>
</main>
<script type="module">
const API = 'https://api.sleeper.app/v1';
const LEAGUE = '1400729034865774592';
const ME = 'bytesmith';
const get = (p) => fetch(API + p).then((r) => r.json());

const [state, users, rosters] = await Promise.all([
  get('/state/nfl'), get(`/league/${LEAGUE}/users`), get(`/league/${LEAGUE}/rosters`),
]);
const week = state.week;
document.getElementById('week').textContent = `${state.season} · Week ${week}`;

const matchups = await get(`/league/${LEAGUE}/matchups/${week}`);
const userName = Object.fromEntries(users.map((u) => [u.user_id, u.display_name]));
const nameOf = (rid) => userName[rosters.find((r) => r.roster_id === rid).owner_id];
const meRid = rosters.find((r) => userName[r.owner_id] === ME).roster_id;

// All-play record: how often each team would have beaten every other lineup that week.
const allPlay = Object.fromEntries(rosters.map((r) => [r.roster_id, 0]));
for (let w = 1; w < week; w++) {
  const ms = await get(`/league/${LEAGUE}/matchups/${w}`);
  for (const m of ms) allPlay[m.roster_id] += ms.filter((o) => o.points < m.points).length;
}
const games = (week - 1) * (rosters.length - 1);

const pts = (s, k) => s[k] + (s[k + '_decimal'] || 0) / 100;
const rows = rosters
  .map((r) => ({ rid: r.roster_id, name: nameOf(r.roster_id), ...r.settings,
                 pf: pts(r.settings, 'fpts'), pa: pts(r.settings, 'fpts_against') }))
  .sort((a, b) => b.wins - a.wins || b.pf - a.pf);
document.getElementById('standings').innerHTML =
  '<tr><th>#</th><th>Team</th><th>W-L</th><th>PF</th><th>PA</th><th>All-play</th><th>FAAB</th></tr>' +
  rows.map((t, i) => `<tr class="${t.rid === meRid ? 'me' : ''}"><td>${i + 1}</td><td>${t.name}</td>
    <td>${t.wins}-${t.losses}</td><td>${t.pf.toFixed(1)}</td><td>${t.pa.toFixed(1)}</td>
    <td>${allPlay[t.rid]}-${games - allPlay[t.rid]}</td><td>$${100 - (t.waiver_budget_used || 0)}</td></tr>`).join('');

const mine = matchups.find((m) => m.roster_id === meRid);
const opp = matchups.find((m) => m.matchup_id === mine.matchup_id && m.roster_id !== meRid);
const cls = (a, b) => (a > b ? 'lead' : a < b ? 'trail' : '');
document.getElementById('matchup').innerHTML = `
  <div><div class="big ${cls(mine.points, opp.points)}">${mine.points.toFixed(1)}</div><div class="name">${ME}</div></div>
  <div class="name">vs</div>
  <div><div class="big">${opp.points.toFixed(1)}</div><div class="name">${nameOf(opp.roster_id)}</div></div>`;
</script>
</body>
</html>
